name: Release
# The title of the run. `release.ts` sends `label` (`0.4.6-1 prerelease · kernel,react,admin,ardor · #450 · 207ce41`:
# version, kind, packages, issue, short commit) and the plan job refuses a label that is not what it computed, so the
# title cannot name a version, kind, issue or commit the run does not use (the packages are the ones dispatched).
# Until the plan job has passed it is only what was sent: a queued or a refused run shows that. A dispatch by hand
# has no label: the title is the version or the bump, the packages, the issue and the whole commit (an expression
# cannot cut a commit short). A heal-only run has no plan job to check a label, so it ignores one.
run-name: "Release · ${{ inputs.heal_only && format('heal the next tags · {0}', github.sha) || inputs.label || format('{0} · {1}{2} · {3}', inputs.version || inputs.build_mode, inputs.packages, inputs.issue && format(' · #{0}', inputs.issue) || '', github.sha) }}"

on:
  workflow_dispatch:
    inputs:
      packages:
        type: string
        description: 'Packages to release in this one run, comma-separated and in dependency order (kernel,react,admin,ardor)'
        required: true
        default: 'kernel,react,admin,ardor'
      build_mode:
        type: choice
        description: 'Version bump type: pre* from develop (a prerelease, no approval), patch | minor | major from main (a stable, one approval)'
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
        required: true
        default: 'prerelease'
      version:
        type: string
        description: 'Explicit version (x.y.z or x.y.z-pre); when set it replaces the bump type'
        required: false
        default: ''
      issue:
        type: string
        description: 'Issue number the release commits serve (prefixes each with [#N])'
        required: false
        default: ''
      label:
        type: string
        description: 'The run title, filled in by scripts/release/release.ts; the plan job refuses one that is not its own (empty = titled by the inputs)'
        required: false
        default: ''
      heal_only:
        type: boolean
        description: 'Only move the next tag to latest for every ARDOR package: publishes nothing, ignores the other inputs'
        required: false
        default: false

# The workflow can write nothing by default; the one job that pushes the release commits and the tags says so.
# Every job checks out the commit that was dispatched, so the plan, the test job, the publish job and the run
# name all name the same commit. There is no npm token anywhere: the release publishes through npm trusted
# publishing, so the two jobs that talk to npm (publish, heal-next) name the environment npm-release and hold
# id-token: write, and no other job holds either.
#
# Four jobs for a release. `plan` decides what this dispatch would release and refuses a ref and a version
# that do not belong together (a prerelease runs from develop, a stable from main and only over a prerelease,
# and on IGNIS stable) before anything is built; for a stable it also tries the merge of main back into develop,
# so a merge that would stop stops before the approval. `test` runs the gates and has no secret. `approve` is the
# one human stop and exists for a stable only: environment release-approval, whose reviewer is the owner.
# `publish` is the only job with the publish identity; it runs after `approve` succeeded, or after `approve` was
# skipped because the plan says prerelease. A prerelease commits its releases to develop. A stable commits them
# to main and the chain then merges main back into develop; nothing waits for a second approval after the click.
# scripts/release/__tests__/release-gates.test.ts fails when one of these guards is removed.
permissions:
  contents: read

# One run releases every package it names, in dependency order (kernel -> react -> admin -> ardor), at one
# version. The umbrella `ardor` depends on the other three by exact version, so they publish first or the
# registry-existence check fails. Every sibling is `workspace:*`, so `bun pm pack` writes its exact version
# into the tarball. The per-package steps are not YAML: scripts/release/release-chain.ts runs them, so a
# test can fail each step and see what is left behind.
#
# One release at a time, repository-wide. A release mutates a shared branch and the registry, and
# the packages form a dependency chain, so two runs must never interleave. `cancel-in-progress: false`
# makes a second dispatch WAIT rather than kill a run that is mid-publish. GitHub keeps only one run
# pending per group: dispatch a third while one runs and one waits and the waiting one is cancelled -
# acceptable here, because the chain has to be released in order anyway.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PACKAGES: ${{ github.event.inputs.packages }}
  BUILD_MODE: ${{ github.event.inputs.build_mode }}
  VERSION: ${{ github.event.inputs.version }}
  # The tarballs bun packs, the checks read and npm publishes: one folder inside the workspace (gitignored).
  # Absolute, because npm reads `.agents/x/y.tgz` as a package spec and `/abs/y.tgz` as a file.
  TARBALLS: ${{ github.workspace }}/.agents/local/tmp/release-tarballs

jobs:
  # What this dispatch would release, from the inputs and the ref, before anything is built: the one version,
  # its kind (a prerelease needs no approval, a stable needs one), the dist-tag and the IGNIS line to build
  # on. It refuses a ref and a version that do not belong together. The logic is scripts/release/release-plan.ts,
  # which has its own tests.
  plan:
    name: Plan
    if: ${{ inputs.heal_only != true }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      kind: ${{ steps.plan.outputs.kind }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      catalog_tag: ${{ steps.plan.outputs.catalog_tag }}
      # The head of develop the merge trial read (empty for a prerelease): the publish job stops if develop moved.
      develop_sha: ${{ steps.plan.outputs.develop_sha }}

    steps:
      # Full history: the merge trial of a stable needs the branches and their common ancestor, and the plan
      # reads the tag of the prerelease it promotes.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # A list that is not in dependency order, packages at different versions under a bump type, a stable that
      # is not the promotion of a prerelease, an IGNIS stable that is not out, a merge back that would stop:
      # each fails here, with every reason, before any build and before anyone is asked to approve.
      - name: Plan the run
        id: plan
        env:
          RELEASE_ISSUE: ${{ inputs.issue }}
          RELEASE_LABEL: ${{ inputs.label }}
        run: bun scripts/release/release-plan.ts plan --packages "$PACKAGES" --version "$VERSION" --mode "$BUILD_MODE" --ref "$GITHUB_REF" --issue "$RELEASE_ISSUE" --merge-trial --label "$RELEASE_LABEL"

  # Everything that needs no secret, on the dispatched commit: the approve and publish jobs need it. Each gate
  # loops over the packages of the run. The clean-install gate is not here: it installs the siblings a package
  # ships with, and before the bump those are the old versions. The chain runs it after the sibling is out.
  test:
    name: Test
    needs: plan
    runs-on: ubuntu-26.04
    env:
      CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}

    steps:
      # -------------------------------------------------------------------------
      # SETUP
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Git
        run: |
          git config user.name "venizia-ci"
          git config user.email "developer@venizia.ai"

      # -------------------------------------------------------------------------
      # PREPARE
      # -------------------------------------------------------------------------
      # BEFORE the install, and across the WHOLE workspace - not just the packages being released.
      # `force-update` rewrites version ranges; an install that ran first has already resolved the
      # old ones. A prerelease tracks the HIGHEST published IGNIS line (prerelease included), a stable the IGNIS
      # `latest` (the plan chose: CATALOG_TAG): the root catalog owns every @venizia/* range, so it is refreshed
      # first, then the per-package script refreshes any range the catalog does not own. Once per job, not per
      # package: four refreshes could give four different catalogs inside one run.
      - name: Force update workspace
        run: |
          bun scripts/build/refresh-catalog.ts "$CATALOG_TAG"
          bun run --filter "@venizia/*" force-update "$CATALOG_TAG"

      - name: Install
        run: bun install

      # Every ARDOR sibling is a member of this workspace, so resolving one to a registry tarball is
      # always wrong: the build would validate code that is not in this repository. The failure mode is
      # invisible otherwise - install succeeds, and the lie surfaces as unrelated-looking type errors.
      - name: Assert internal dependencies link to the workspace
        run: |
          for package in ${PACKAGES//,/ }; do
            bun scripts/release/release-gates.ts links "packages/$package"
          done

      # One copy of every @venizia/* package. A workspace member that does not declare an IGNIS package
      # itself gets the stable copy for its peer range (it excludes the prerelease), and two copies of
      # inversion are two sets of types: the build fails far from the cause. This names the member.
      - name: Assert one copy of every @venizia package
        run: bun scripts/release/release-gates.ts single-copy

      # -------------------------------------------------------------------------
      # BUILD, LINT & VALIDATE (uses Makefile dependency chain)
      # -------------------------------------------------------------------------
      - name: Build
        run: |
          for package in ${PACKAGES//,/ }; do
            make "$package"
          done

      - name: Lint
        run: |
          for package in ${PACKAGES//,/ }; do
            make "lint-$package"
          done

      - name: Test the package
        run: |
          for package in ${PACKAGES//,/ }; do
            make "test-$package"
          done

      - name: Test the repository scripts
        run: make test-scripts

      # The gate's own regression tests run first: a probe that silently stopped detecting anything
      # would leave every `purity-*` target green for the wrong reason.
      - name: Purity probe self-test
        run: make purity-test

      - name: Purity gate
        run: |
          for package in ${PACKAGES//,/ }; do
            make "purity-$package"
          done

      - name: Check dependency catalog
        run: make catalog-check

      # An app created from the PACKED preset typechecks, lints, builds and starts without a warning.
      # Before the bump and the publish: a preset that cannot create a working app must not ship.
      - name: VULCAN preset smoke
        if: ${{ contains(format(',{0},', inputs.packages), ',ardor,') }}
        env:
          # The VULCAN this repository pins (root package.json), never the newest release.
          VULCAN_CMD: bun x @venizia/vulcan@0.4.7
        run: make preset-smoke

  # The one human stop, for a stable only: the plan says so, and the job is skipped for a prerelease. It runs after
  # the gates, so the owner never approves a release that fails them, and its name carries the target version. The
  # environment release-approval holds the reviewer and its ref rule (main only); its settings are GitHub's, not this
  # file's, and this line is what makes the job subject to them. The job holds no permission and runs nothing but an
  # echo: the approval is the click.
  approve:
    name: Approve ${{ needs.plan.outputs.version }}
    needs: [plan, test]
    if: ${{ needs.plan.outputs.kind == 'stable' }}
    environment: release-approval
    permissions: {}
    runs-on: ubuntu-26.04

    steps:
      - name: Approved
        run: echo "approved - $PLAN_VERSION"
        env:
          PLAN_VERSION: ${{ needs.plan.outputs.version }}

  publish:
    name: NPM Release
    needs: [plan, test, approve]
    # A prerelease has no approval, so `approve` is skipped for it and publish still runs; a stable runs only after
    # `approve` succeeded. A skipped `approve` on a stable stops it. A job whose `needs` was skipped is skipped
    # unless its `if` says otherwise, so both cases are written out; a failed or cancelled dependency stops it too.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.test.result == 'success'
      && (needs.approve.result == 'success'
      || (needs.approve.result == 'skipped' && needs.plan.outputs.kind == 'prerelease')) }}
    # The environment is what the trusted publisher on npmjs.com names, and its ref rule lets only a run on develop
    # or main enter. It has no reviewers: the owner's approval is the `approve` job's, and only a stable has one.
    environment: npm-release
    env:
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      PLAN_KIND: ${{ needs.plan.outputs.kind }}
      CATALOG_TAG: ${{ needs.plan.outputs.catalog_tag }}
    # The release pushes the release commits and the tags: it writes contents. `id-token` is what trusted
    # publishing signs with: npm exchanges the job's identity for a short-lived publish credential, so the
    # release holds no npm token at all. The test job has neither grant.
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-26.04

    steps:
      # -------------------------------------------------------------------------
      # SETUP
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Git
        run: |
          git config user.name "venizia-ci"
          git config user.email "developer@venizia.ai"

      # A stable is approved against what the plan saw: main where the dispatch left it, and the head of develop the
      # merge trial read. Either moving means the approved merge is not the one that would run, so nothing is
      # published; it is checked before the first mutation.
      - name: Refuse a stable when a branch moved since the plan
        if: ${{ needs.plan.outputs.kind == 'stable' }}
        env:
          PLAN_DEVELOP_SHA: ${{ needs.plan.outputs.develop_sha }}
        run: |
          git fetch --quiet origin main develop

          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "ERROR: main moved since this run was dispatched ($GITHUB_SHA, now $(git rev-parse origin/main)) - nothing is published"
            exit 1
          fi

          if [ "$(git rev-parse origin/develop)" != "$PLAN_DEVELOP_SHA" ]; then
            echo "ERROR: develop moved since the plan tested the merge back ($PLAN_DEVELOP_SHA, now $(git rev-parse origin/develop)) - nothing is published; dispatch again"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later to publish and 11.21.0 or later to move a dist-tag; the npm
      # that ships with this Node is older. An exact version, never `latest`, asserted.
      - name: Install the npm that publishes
        run: |
          npm install --global npm@11.21.1 --ignore-scripts
          [ "$(npm --version)" = "11.21.1" ] || { echo "ERROR: npm is $(npm --version), expected 11.21.1"; exit 1; }

      # -------------------------------------------------------------------------
      # PREPARE
      # -------------------------------------------------------------------------
      # The version, the kind and the IGNIS line were decided by the plan job and are not worked out again here:
      # the chain gets the plan's version and kind and refuses a run that would publish another.
      # BEFORE the install, and across the WHOLE workspace - not just the packages being released.
      # `force-update` rewrites version ranges; an install that ran first has already resolved the
      # old ones. ARDOR tracks the HIGHEST published IGNIS line (prerelease included), never
      # `latest`: the root catalog owns every @venizia/* range, so it is refreshed first, then the
      # per-package script refreshes any range the catalog does not own. Once per job, not per package:
      # four refreshes could give four different catalogs inside one run.
      - name: Force update workspace
        run: |
          bun scripts/build/refresh-catalog.ts "$CATALOG_TAG"
          bun run --filter "@venizia/*" force-update "$CATALOG_TAG"

      - name: Install
        run: bun install

      # -------------------------------------------------------------------------
      # RELEASE - every gate, bump, publish and git write of every package, in release-chain.ts
      # -------------------------------------------------------------------------
      # Phase A checks every package before the first publish. Phase B then takes the packages one at a time:
      # clean-install, bump, preset, pack, checksum, publish, wait until the tarball answers 200, dist-tags,
      # release commit, push, tag. The publish runs ahead of every git write of its package: a failed publish
      # leaves git untouched. The push is never rebased, and a failure is reported, never repaired by a
      # force-push: npm cannot un-publish. A stable then merges main back into develop, in a worktree of its own
      # and from a copy of this checkout's merge-back.ts. The state of every package is written to a file after
      # each step.
      - name: Release the packages
        env:
          RELEASE_ISSUE: ${{ inputs.issue }}
        run: |
          ARGS=(--packages "$PACKAGES" --version "$PLAN_VERSION" --plan-version "$PLAN_VERSION" --plan-kind "$PLAN_KIND" --target-branch "$GITHUB_REF_NAME" --branch "release-${{ github.run_id }}" --tarballs "$TARBALLS" --tmp "$RUNNER_TEMP" --state "$RUNNER_TEMP/release-state.json")
          if [ -n "$RELEASE_ISSUE" ]; then
            ARGS+=(--issue "$RELEASE_ISSUE")
          fi
          bun scripts/release/release-chain.ts "${ARGS[@]}"

      # -------------------------------------------------------------------------
      # GITHUB RELEASE
      # -------------------------------------------------------------------------
      # One Release for the run, on the tag of the last package it released (`ardor-v<version>` for a full run): a
      # stable is marked Latest only when no higher stable tag exists, with the changelog entries added since the
      # previous stable (or a line saying there is no change for users); a prerelease is marked Pre-release and
      # never Latest. A tag that has a Release is skipped, and so is a tag this run did not make. The step runs
      # after a chain that stopped too, because the tags it made stand. A failure is reported in the run summary
      # and never fails or undoes a publish. The script refuses the tag of the atlas index, whose release is not a
      # publish's.
      - name: Create the GitHub Release
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/github-release.ts create --version "$PLAN_VERSION" --kind "$PLAN_KIND" --packages "$PACKAGES"

      # A job that was cancelled or timed out runs no script of its own, so the report is a step of its own,
      # read from the state file: which package stopped, which are done, and the repair that fits.
      - name: Report the run
        if: ${{ always() }}
        run: bun scripts/release/release-chain.ts report --state "$RUNNER_TEMP/release-state.json"

  # A dispatch with heal_only runs only this job: it moves a stale `next` tag to `latest` for every
  # ARDOR package without publishing anything (the same check a release runs after each publish).
  heal-next:
    name: Heal next tags
    if: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && inputs.heal_only == true }}
    # It moves a dist-tag, so it is a trusted-publisher action like the release: the same environment and the
    # identity npm trades for a short-lived credential. It reads the repository and writes nothing to it.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install the npm that publishes
        run: |
          npm install --global npm@11.21.1 --ignore-scripts
          [ "$(npm --version)" = "11.21.1" ] || { echo "ERROR: npm is $(npm --version), expected 11.21.1"; exit 1; }

      - name: Move next to latest where it is below
        run: bun scripts/release/release-gates.ts heal-next
