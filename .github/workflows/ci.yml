name: CI
run-name: 'CI | ${{ github.event_name }} | ${{ github.head_ref || github.ref_name }}'

# Manual only, by decision. These gates are a full build, seven test suites, lint and the purity
# probe, and they used to fire on every pull request AND every push to develop - including the
# release workflow's own commits, so a four-package release chain paid for four extra full runs.
# Nothing enforces this workflow as a required status check, so running it on demand blocks nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gates:
    name: Source gates
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The atlas computes releases from the tags; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install

      - name: Dependency catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make catalog-check

      - name: Knowledge bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make okf-check-strict

      # A fresh checkout has no adapters; sync writes them, so doctor checks the project, not the runner.
      - name: Agent setup (VULCAN)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make vulcan-sync vulcan-doctor

      - name: Browser purity probe
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make purity-test

      - name: Gate scripts' own tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-scripts

      - name: Wiki source links
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make wiki-links-check

  build-and-test:
    name: Build, test and lint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The atlas computes releases from the tags; a shallow clone has none.
          fetch-depth: 0

      # The clean-install gate loads every entry under Node's ESM loader as well as Bun's.
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install

      - name: Build
        id: build
        run: make build-all

      # Packs the packages and creates an app from the packed preset outside the repository: a preset
      # that does not build a green app blocks the release.
      - name: VULCAN preset smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make preset-smoke

      # The make targets own the test command (make/project.mk: NODE_ENV=test, the setup preload and the
      # optional BUN_TEST_FLAGS), so CI and a developer's `make test-<pkg>` run the very same command.
      - name: Test - kernel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-kernel

      - name: Test - react
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-react

      - name: Test - admin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-admin

      - name: Test - ardor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-ardor

      - name: Layer boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make layer-check

      - name: Import cycles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make cycles-check

      - name: Public surface
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make surface-check

      - name: Bundle budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make size-check

      # Compiles every ```ts fence of the wiki against the built packages, and fails on an orphan page.
      - name: Docs build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make docs

      - name: Wiki anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make wiki-anchors-check

      # The symbol lookup reads the built types, so this step needs the build.
      - name: Atlas smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make atlas-smoke

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make lint-all

      # One loop over the whole manifest, so this gate and a release read the same rows.
      - name: Browser purity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make purity

      - name: Clean install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make clean-install
