# The response headers of the app, included by every location of nginx.conf.template. `always` sends
# them on error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# A Content-Security-Policy depends on what the app loads, so none is sent. An example to adapt: start with
# Content-Security-Policy-Report-Only, watch the browser console, then switch to the enforcing header. Admin
# libraries often need 'unsafe-inline' for styles. `frame-ancestors` replaces X-Frame-Options where both exist.
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
