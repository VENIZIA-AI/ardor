# The response headers of the app, included by every location of nginx.conf.template. `always` sends
# them on error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# A Content-Security-Policy, in report-only mode: the browser reports what it would block in its console and
# blocks nothing. It fits the app as generated (the config.js script and the module script are of the same
# origin, the favicon is a data: URL, the styles are linked, /api is of the same origin). Adapt it to what the app
# loads (an API of another origin goes into connect-src, a CDN into script-src and style-src), watch the console,
# then change the header name to Content-Security-Policy to enforce it. Admin libraries often need 'unsafe-inline'
# for styles. `frame-ancestors` replaces X-Frame-Options where both exist.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
