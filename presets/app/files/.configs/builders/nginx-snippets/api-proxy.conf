# The /api proxy. The script 45-api-proxy.sh fills in the two variables API_UPSTREAM and NGINX_LOCAL_RESOLVERS and
# writes the result to /etc/nginx/conf.d/api-proxy.locations, only when API_UPSTREAM is set and not empty.
#
# The path is kept: /api/hello reaches the upstream at /api/hello. The upstream is a variable that a resolver
# looks up per request, so nginx starts when the host does not resolve yet and only /api answers 502 until it does.
location /api/ {
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $api_upstream ${API_UPSTREAM};
  proxy_pass $api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Behind a trusted front proxy (an ingress, a load balancer) this keeps the client address it appends. A
  # browser can put its own value first in X-Forwarded-For, and $scheme is http here whatever the front proxy
  # served: a backend must trust only the entries its own proxy added, and learn the scheme from that proxy. With
  # no front proxy, replace the value with $remote_addr.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
