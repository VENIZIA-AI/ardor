# `bun fmt` finds this file from the folder it runs in or from any parent, so a package picks up [fmt].
telemetry = false

# One style for every file, the node style of IGNIS. `flavor` pins the output: without it Bun may change it.
[fmt]
printWidth = 100
singleQuote = true
arrowParens = "always"
flavor = "oxfmt"
