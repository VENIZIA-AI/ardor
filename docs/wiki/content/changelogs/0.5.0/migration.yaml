typed-core-bindings:
  symbols: [ICoreBindingTypes, TCoreBindingType]
  upgrade:
    steps:
      - 'Bind each value under a `CoreBindings` key with the type that key carries (the table below); a value of another type is a compile error.'
      - 'Run `bun check`; each error at a bind under a `CoreBindings` key is a place to change.'
      - 'In a test that binds a partial fake, make an untyped key from the constant: `BindingKeys.build<unknown>({ key: CoreBindings.APPLICATION_INFO })`.'
    before: |-
      container.bind({ key: CoreBindings.APPLICATION_INFO }).toValue({ id: 'info' });
    after: |-
      container.bind({ key: BindingKeys.build<unknown>({ key: CoreBindings.APPLICATION_INFO }) }).toValue({ id: 'info' });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line, where the keys of CoreBindings are plain strings.
  data: Nothing stored changes. The key strings are the same, so a stored or sent key still matches. The four values whose types live in `@venizia/ardor-admin` (the three default providers and the i18n options) are typed through `ICoreBindingTypes`, which that package merges into; code that imports only `@venizia/ardor-kernel` reads them as `unknown`.

typed-injectable-keys:
  symbols:
    [
      IUseInjectableKeyTypes,
      IUseInjectableKeysOverrides,
      TUseInjectableKeys,
      TUseInjectableKeysDefault,
      IUseInjectableByKey,
      useInjectable,
      useProvider,
      useService,
      useRepository,
      useComponent,
      useConfiguration,
    ]
  upgrade:
    steps:
      - 'Delete each `declare module` block that adds a key to `IUseInjectableKeyTypes` or `IUseInjectableKeysOverrides`.'
      - 'Make the key with `BindingKeys.build<T>({ key })` and give `T` the type the block listed; use the constant where the value is bound and where the hook reads it.'
      - 'Drop the generic you wrote with `useInjectable({ key })`: the key carries the type.'
      - 'Keep `IUseTranslateKeysOverrides` blocks; they are unchanged.'
    before: |-
      class ClockKeys {
        static readonly NOW = '@app/clock/now';
      }
      declare module '@venizia/ardor' {
        interface IUseInjectableKeyTypes {
          [ClockKeys.NOW]: () => number;
        }
      }
      const now = useInjectable({ key: ClockKeys.NOW });
    after: |-
      class ClockKeys {
        static readonly NOW = BindingKeys.build<() => number>({ key: '@app/clock/now' });
      }
      const now = useInjectable({ key: ClockKeys.NOW });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line, and restore the `declare module` blocks.
  data: Nothing stored changes. The hooks take only a key made by `BindingKeys.build`; a plain string, a template literal or a symbol does not compile. A key made with `build<unknown>` answers `unknown`. `IUseInjectableByKey` is now generic over the value type of the key, not over a string union.

built-keys-only:
  symbols:
    [
      BindingKeys.build,
      Container.get,
      Container.bind,
      Container.isBound,
      Container.getBinding,
      inject,
      provide,
    ]
  upgrade:
    steps:
      - 'Run `bun run devz codemod binding-keys` inside the package (needs `@venizia/dev-configs` 0.5): it rewrites each literal key to `BindingKeys.build<T>({ key })` and lists each key it left as `build<unknown>` so you can name the real type.'
      - 'Run `bun check`; each key it still reports is a plain string that needs the same wrap. A `Symbol` key becomes a string key by hand.'
    before: |-
      container.get<Mailer>({ key: 'services.Mailer' });
      @provide({ key: 'services.Mailer' })
    after: |-
      container.get({ key: BindingKeys.build<Mailer>({ key: 'services.Mailer' }) });
      @provide({ key: BindingKeys.build<Mailer>({ key: 'services.Mailer' }) })
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line, and restore the files from git.
  data: Nothing stored changes; the key strings do not change. `bindingList()` still returns a record keyed by plain strings, and the application builds each key itself. `BindingKeys` is exported by `@venizia/ardor` and `@venizia/ardor-kernel`.

network-response-reader-rename:
  symbols: [ResponseReader, NetworkResponseReader]
  upgrade:
    steps:
      - 'Rename `ResponseReader` to `NetworkResponseReader` in each import and use.'
    before: |-
      import { ResponseReader } from '@venizia/ardor';
      const name = ResponseReader.readFilename({ headers: response.headers });
    after: |-
      import { NetworkResponseReader } from '@venizia/ardor';
      const name = NetworkResponseReader.readFilename({ headers: response.headers });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier and rename `NetworkResponseReader` back to `ResponseReader`.
  data: Nothing stored changes. The behaviour is the same; the name no longer collides with the `ResponseReader` of `@venizia/ignis-helpers`. There is no alias. Rename it by hand; there is no codemod.

native-fetch-network-request:
  symbols:
    [
      NodeFetchNetworkRequest,
      NativeFetchNetworkRequest,
      DefaultNetworkRequestService.networkRequest,
    ]
  upgrade:
    steps:
      - "In a service subclass that assigns the protected `networkRequest`, use `NativeFetchNetworkRequest` from `@venizia/ignis-helpers/core`, and `BaseNetworkRequest<'native'>` for a request with a fetcher of your own."
      - 'A fetcher you pass must send with `acceptStatus` that accepts every status, because `doRequest` reads a 4xx or 5xx `Response` itself.'
    before: |-
      this.networkRequest = new NodeFetchNetworkRequest({ name, networkOptions: { baseUrl } });
    after: |-
      this.networkRequest = new NativeFetchNetworkRequest({ name, networkOptions: { baseUrl } });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line, and rename the class back.
  data: "Nothing stored changes. `doRequest` sends every status through to ARDOR's own reader, so a non-2xx still becomes the same `ApplicationError`. A call that carries headers still sends those alone, and a header removed with `removeHeaders` is not sent; the default `content-type` is dropped unless the call names it, so a multipart body keeps the boundary `fetch` writes. A raw body (`FormData`, `Blob`, `URLSearchParams`, bytes, a stream) with no `content-type` of its own is sent with none, with or without call headers."

request-path-refusal:
  symbols: [DefaultNetworkRequestService.doRequest]
  upgrade:
    steps:
      - 'Match the new text in a test or a handler: a path that leaves the base now answers `A request path must stay under the base path`, where it answered `[doRequest] Invalid path to send request!`.'
      - 'Give a relative base URL (`/api`) only where the code runs in a page or a worker; with no location it is refused.'
    before: |-
      expect(error.message).toContain('[doRequest] Invalid path to send request!');
    after: |-
      expect(error.message).toContain('A request path must stay under the base path');
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line.
  data: Nothing stored changes. The status is still 400 for a path and nothing is sent; a relative base without a location, and a base URL with a `?` or a `#`, answer a 500. The refusal now comes from IGNIS, which also refuses a base that carries a `?` or a `#`. A relative base resolves against the page's origin, and a space in a path is percent-encoded (`a%20b`).

connectors-http-types-removed:
  symbols:
    [
      THttpQuery,
      TAuthTokenResolver,
      THttpHeadersResolver,
      HttpResourceEntity,
      THttpRepositoryOptions,
    ]
  upgrade:
    steps:
      - 'Replace each use with a type of your own, or inline it. `TAuthTokenResolver` was `(context: IHttpRequestContext) => IAuthToken | undefined`, `THttpHeadersResolver` was `(context: IHttpRequestContext) => THttpHeaders | undefined` and `THttpQuery<E>` was `{ filter?: TFilter<E> }`.'
    before: |-
      import type { TAuthTokenResolver } from '@venizia/ardor/repository';
      const resolve: TAuthTokenResolver = () => token;
    after: |-
      import type { IAuthToken, IHttpRequestContext } from '@venizia/ardor/repository';
      const resolve = (_context: IHttpRequestContext): IAuthToken | undefined => token;
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line, where the five types exist.
  data: Nothing stored changes. These types are removed by IGNIS from `@venizia/ignis-connectors/http`, which `@venizia/ardor/repository` re-exports; `THttpFetch` stays. There is no codemod.

ignis-0-5-peers:
  symbols:
    [
      '@venizia/ignis-kernel',
      '@venizia/ignis-helpers',
      '@venizia/ignis-inversion',
      '@venizia/ignis-filter',
      '@venizia/ignis-connectors',
      '@venizia/ignis-boot',
      '@venizia/dev-configs',
    ]
  upgrade:
    steps:
      - 'Upgrade the IGNIS packages of the app to 0.5.0, with `@venizia/dev-configs` 0.5.0 for the app preset.'
    before: |-
      "@venizia/ignis-kernel": "^0.4.8"
    after: |-
      "@venizia/ignis-kernel": "^0.5.0"
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, and the IGNIS packages to the 0.4 line.
  data: Nothing stored changes. The four ARDOR packages declare `^0.5.0` peers on the IGNIS packages (while IGNIS 0.5.0 is a prerelease the ranges are `^0.5.0-13` for `@venizia/ignis-connectors`, `^0.5.0-12` for `@venizia/ignis-kernel`, `^0.5.0-11` for `@venizia/ignis-helpers` and `@venizia/ignis-boot`, and `^0.5.0-5` for the other IGNIS packages); an app on a 0.4 IGNIS line does not satisfy them. The app preset needs `@venizia/dev-configs` `^0.5.0-9` while it is a prerelease.

data-source-auth-attempt:
  symbols:
    [IDataSourceAuth, IDataSourceUnauthorizedInfo, DefaultNetworkRequestService.getDataSourceAuth]
  upgrade:
    steps:
      - 'Pass the second argument where you call `getDataSourceAuth().onUnauthorized`, in a test or in code that wraps the hook: `{ attempt: 1 }` for the first 401.'
      - "A hook of your own that you give `HttpDataSource` takes `(context, info)`; on `info.attempt` 2, the retry's own 401, return `false`."
    before: |-
      const isRefreshed = await auth.onUnauthorized(context);
    after: |-
      const isRefreshed = await auth.onUnauthorized(context, { attempt: 1 });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.4.8 or earlier, with the IGNIS packages of the 0.4.8 line.
  data: "Nothing stored changes. IGNIS calls the hook on the retry's own 401 too; ARDOR answers false there without refreshing, so a request is refreshed once and retried once, as before."

value-utility-trim:
  symbols: [ValueUtility.isObject, ValueUtility.isValidDate]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace` to list each place (file:line); it writes nothing.'
      - 'Replace `ValueUtility.isObject({ value })` with `typeof value === "object" && value !== null && !Array.isArray(value)`.'
      - 'Replace `ValueUtility.isValidDate({ value })` with `!Number.isNaN(new Date(value).valueOf())`.'
    before: |-
      if (ValueUtility.isValidDate({ value: input })) save(input);
    after: |-
      if (!Number.isNaN(new Date(input).valueOf())) save(input);
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. `ValueUtility.isDefined`, `isString` and `isNumber` are unchanged.

ignis-http-readers-moved:
  symbols: [HttpResponseReader, THttpHeaders, HttpWireHeaders]
  upgrade:
    steps:
      - 'Import `HttpResponseReader` and `THttpHeaders` from `@venizia/ignis-helpers/core` and not from `@venizia/ardor/repository`.'
      - 'Replace `HttpWireHeaders` with `HttpHeaders` from `@venizia/ignis-helpers/core`.'
      - 'Install ARDOR 0.5.0-3 or later with IGNIS kernel 0.5.0-2 or later: ARDOR 0.5.0-2 with that kernel fails on import.'
    before: |-
      import { HttpResponseReader } from '@venizia/ardor/repository';
    after: |-
      import { HttpResponseReader } from '@venizia/ignis-helpers/core';
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-2 with IGNIS kernel 0.5.0-1, or to 0.4.8 with the IGNIS 0.4 line.
  data: Nothing stored changes. Only where these classes are imported from changes.

header-constants-removed:
  symbols: [HeaderConstants]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace` to list each place (file:line); it writes nothing.'
      - 'Import `HTTP` from `@venizia/ignis-helpers/common` and read `HTTP.Headers.<NAME>` where you read `HeaderConstants.<NAME>`.'
      - 'Two names change: `X_AUTH_PROVIDER` is `AUTH_PROVIDER` and `X_LOCALE` is `LOCALE`. Every other name is the same.'
      - 'The two regular expressions are removed with no replacement; write your own if you used them.'
    before: |-
      headers[HeaderConstants.X_LOCALE] = locale;
    after: |-
      headers[HTTP.Headers.LOCALE] = locale;
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. The header names on the wire are the same strings.

network-headers-removed:
  symbols: [NetworkHeaders, DefaultNetworkRequestService.headers]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace` to list each place (file:line); it writes nothing.'
      - 'Replace `NetworkHeaders.merge({ sources: [a, b] })` with `HttpHeaders.merge({ layers: [a, b] })` from `@venizia/ignis-helpers/core`; a layer is a record, a `Headers` or a list of pairs; it answers a `Headers`, and `Object.fromEntries(...)` gives the record.'
      - 'A layer that is `null` or `undefined` is skipped, as `NetworkHeaders.merge` skipped a missing source, so an optional layer needs no guard.'
      - 'Replace `NetworkHeaders.toRecord({ headers })` with `Object.fromEntries(new Headers(headers))`.'
      - 'A subclass of `DefaultNetworkRequestService` that reads `this.headers[name]` reads `this.headers.get(name)`. The codemod does not list that read: search your subclasses for `this.headers[`.'
    before: |-
      const headers = NetworkHeaders.merge({ sources: [base, extra] });
    after: |-
      const headers = Object.fromEntries(HttpHeaders.merge({ layers: [base, extra] }));
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. Header names are lowercase on the wire, as before.

authentication-removed:
  symbols: [Authentication]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace` to list each place (file:line); it writes nothing.'
      - 'Replace `Authentication.TYPE_BEARER` with `App.TOKEN_TYPE` (or the string `"Bearer"`), and `Authentication.TYPE_BASIC`, `STRATEGY_BASIC` and `STRATEGY_JWT` with your own strings.'
      - 'Replace `Authentication.isValid(value)` with your own check.'
    before: |-
      token: { value, type: Authentication.TYPE_BEARER },
    after: |-
      token: { value, type: App.TOKEN_TYPE },
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. A stored token keeps its own type, and one with none is still sent as Bearer.

to-error-removed:
  symbols: [ResponseReader.toError, NetworkResponseReader.toError]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace` to list each place (file:line); it writes nothing.'
      - 'Replace `NetworkResponseReader.toError({ response })` (`ResponseReader.toError` in 0.4.8) with `HttpResponseReader.toApplicationError({ response, rootKey: NetworkResponseReader.ERROR_ROOT_KEY })`, importing `HttpResponseReader` from `@venizia/ignis-helpers/core`.'
    before: |-
      throw await NetworkResponseReader.toError({ response });
    after: |-
      throw await HttpResponseReader.toApplicationError({ response, rootKey: NetworkResponseReader.ERROR_ROOT_KEY });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. The error carries the same status, text, code, args and request ids.

auth-recovery-helper:
  symbols: [AuthRecovery, AuthRecoveryHelper]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace` to list each place (file:line); it writes nothing.'
      - 'Rename `AuthRecovery` to `AuthRecoveryHelper` (import and use).'
      - 'Remove the `logger` option from `new AuthRecoveryHelper({ ... })`: the helper logs under its own name.'
    before: |-
      const recovery = new AuthRecovery({ logger, getRefreshTokenPath, refresh, onFailure, isNoAuthPath });
    after: |-
      const recovery = new AuthRecoveryHelper({ getRefreshTokenPath, refresh, onFailure, isNoAuthPath });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. Only the name and the logger scope change.

use-injectable-no-claim:
  symbols: [useInjectable, IUseInjectableByTarget, IUseInjectableByKey]
  upgrade:
    steps:
      - 'Find each `useInjectable<X>(opts)` where `opts` is typed as both `{ target }` and `{ key }`: the compiler now refuses the generic.'
      - 'Pass `{ target }` (the class gives the type) or a key made by `BindingKeys.build<X>` (the key gives it), and drop the generic.'
      - 'Where one variable has to hold either shape, call `useInjectable(opts)` without a generic and narrow the `unknown` result.'
    before: |-
      const service = useInjectable<PricingService>(opts);
    after: |-
      const service = useInjectable({ target: PricingService });
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-3 or earlier.
  data: Nothing stored changes. Only the type of the call changes; at run time `useInjectable` resolves the same binding.

const-classes-extend-const-class:
  symbols:
    [
      RequestMethods.SCHEME_SET,
      RequestTypes.SCHEME_SET,
      RequestBodyTypes.SCHEME_SET,
      Environments.SCHEME_SET,
      RequestChannel.SCHEME_SET,
      RequestCountData.SCHEME_SET,
      UnresolvedPolicies.SCHEME_SET,
    ]
  upgrade:
    steps:
      - 'Run `bun node_modules/.bin/devz codemod const-classes .` (needs `@venizia/dev-configs` 0.5.0-6) to list each place, then `bun node_modules/.bin/devz codemod const-classes . --write` to rewrite each `X.SCHEME_SET.has(value)` of these classes to `X.isValid(value)` and each spread of the set to `X.values()`. It also converts your exported string-literal unions into `ConstClass` classes (`export type TMode = "a" | "b"` becomes `class Modes extends ConstClass`), so review that part of the diff; `--map <file>` with `{ "skip": true }` for an entry leaves a union as it is.'
      - 'Replace by hand what it lists as manual: a `new Set(X.SCHEME_SET)` is `new Set(X.values())`, and `X.SCHEME_SET.size` is `X.values().length`.'
      - 'In a browser app, import `ConstClass` from `@venizia/ignis-helpers/common`, never from the helpers root: the root loads Node built-ins.'
      - 'From 0.5.0-14 `RequestMethods` is removed: follow the entry `request-methods-removed` for it.'
    before: |-
      if (RequestBodyTypes.SCHEME_SET.has(bodyType)) send(bodyType);
      const known = [...RequestTypes.SCHEME_SET];
    after: |-
      if (RequestBodyTypes.isValid(bodyType)) send(bodyType);
      const known = RequestTypes.values();
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-6 or earlier and restore the files from git.
  data: 'Nothing stored changes. The values are the same strings. `isValid` takes `unknown` now and narrows to the union of the values; `values()` answers them as a tuple, base class first. `LocalStorageKeys` keeps its `SCHEME_SET` and its `isValid(value: string)`.'

stored-auth-user-rename:
  symbols: [IAuthUser]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace --write` inside the package; it renames `IAuthUser` imported from an ARDOR package to `IStoredAuthUser`. An import of the same name from an IGNIS package stays as it is.'
      - 'Run `bun check`; rename by hand what is left: a re-export (`export type { IAuthUser } from`), `import(...)` types and a namespace import.'
      - 'Rename by hand each `declare module` block of an ARDOR package that adds fields to `IAuthUser`: the codemod does not change it, and TypeScript then declares a new type of the old name instead of reporting an error.'
    before: |-
      import type { IAuthUser } from '@venizia/ardor';
      const readName = (opts: { user: IAuthUser }) => opts.user.username;
    after: |-
      import type { IStoredAuthUser } from '@venizia/ardor';
      const readName = (opts: { user: IStoredAuthUser }) => opts.user.username;
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-12 or earlier and rename IStoredAuthUser back to IAuthUser.
  data: Nothing stored changes. Only the name of the type changes.
  codemod: namespace

ardor-artifact-index-rename:
  symbols: [IArtifactIndex]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace --write` inside the package; it renames `IArtifactIndex` imported from an ARDOR package to `IArdorArtifactIndex`. An import of the same name from an IGNIS package stays as it is.'
      - 'Run `bun check`; rename by hand what is left: a re-export (`export type { IArtifactIndex } from`), `import(...)` types and a namespace import.'
      - 'Rename by hand each `declare module` block of an ARDOR package that adds fields to `IArtifactIndex`: the codemod does not change it, and TypeScript then declares a new type of the old name instead of reporting an error.'
    before: |-
      import type { IArtifactIndex } from '@venizia/ardor';
      const indexes: Array<IArtifactIndex> = [];
    after: |-
      import type { IArdorArtifactIndex } from '@venizia/ardor';
      const indexes: Array<IArdorArtifactIndex> = [];
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-12 or earlier and rename IArdorArtifactIndex back to IArtifactIndex.
  data: Nothing stored changes. Only the name of the type changes.
  codemod: namespace

application-props-rename:
  symbols: [IApplication]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod namespace --write` inside the package; it renames `IApplication` imported from an ARDOR package to `IArdorApplicationProps`. An import of the same name from an IGNIS package stays as it is.'
      - 'Run `bun check`; rename by hand what is left: a re-export (`export type { IApplication } from`), `import(...)` types and a namespace import.'
      - 'Rename by hand each `declare module` block of an ARDOR package that adds fields to `IApplication`: the codemod does not change it, and TypeScript then declares a new type of the old name instead of reporting an error.'
    before: |-
      import type { IApplication } from '@venizia/ardor';
      const readResources = (opts: { props: IApplication }) => opts.props.resources;
    after: |-
      import type { IArdorApplicationProps } from '@venizia/ardor';
      const readResources = (opts: { props: IArdorApplicationProps }) => opts.props.resources;
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-12 or earlier and rename IArdorApplicationProps back to IApplication.
  data: Nothing stored changes. Only the name of the type changes.
  codemod: namespace

application-info-open-keys:
  symbols: [IApplicationInfo]
  upgrade:
    steps:
      - 'Run `bun check`; each "Index signature for type ''string'' is missing" at an `IApplicationInfo` is a value typed by your own `interface` or class.'
      - 'Make that type a `type` alias, or let the interface extend `IApplicationInfo`. A class instance is copied into an object: `{ ...info }` for plain fields.'
      - 'Replace `Omit<IApplicationInfo, K>` with `Pick<IApplicationInfo, ...>` of the fields you keep.'
    before: |-
      interface IShopInfo {
        name: string;
        version: string;
        description: string;
      }
      const read = (opts: { info: IShopInfo }): IApplicationInfo => opts.info;
    after: |-
      type TShopInfo = {
        name: string;
        version: string;
        description: string;
      };
      const read = (opts: { info: TShopInfo }): IApplicationInfo => opts.info;
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-12 or earlier. A `type` alias fits that release too; remove any key of your own from an `IApplicationInfo` literal.
  data: Nothing stored changes. Only what TypeScript accepts changes.

auth-provider-resource-generic-removed:
  symbols: [DefaultAuthProvider]
  upgrade:
    steps:
      - 'Run `bun check`; each "Type ''DefaultAuthProvider'' is not generic" is a type argument to remove.'
      - 'In a subclass with its own constructor, type the data provider parameter as `IDataProvider`, with no type argument.'
    before: |-
      class ShopAuthProvider extends DefaultAuthProvider<'auth/sign-in'> {}
    after: |-
      class ShopAuthProvider extends DefaultAuthProvider {}
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-12 or earlier. A class with no type argument compiles there too.
  data: Nothing stored changes. Only what TypeScript accepts changes.

unchecked-response-types-removed:
  symbols:
    [
      IDataProvider,
      DefaultRestDataProvider,
      DefaultNetworkRequestService,
      NetworkResponseReader,
      IResponseSchema,
      CountRestDataProvider,
      RequestCountData,
    ]
  upgrade:
    steps:
      - 'Run `bun check` to see every place to change. "Expected 0 type arguments" and "Property ''schema'' is missing" mark each `send`, `doRequest`, `request`, `read` or `convertResponse` that named a type nothing checked; an error on the use of `data` marks one whose type came from the code around it.'
      - 'At each place, drop the type argument and pass a `schema`: a zod schema, or an object whose `parse` returns the checked value and throws otherwise. Without a schema, narrow `data` before you use it.'
      - 'In a subclass that overrides `send` or `request`, declare the two overloads, and hand an answer your own transport built to `NetworkResponseReader.checkData` when a schema is given.'
      - 'Pass a schema only to a route that answers JSON or a file. With one, plain text that is no JSON, broken JSON, an empty body and a 204 are refused (`invalid_json`). A route that answers either one of those or JSON needs two code paths, or no schema and your own check.'
      - 'Make a count route, and the body of a `DATA_WITH_COUNT` list, send `count` as a non-negative integer or a string of digits. Any other value now gives 0 and a warning, where it was passed on before.'
      - 'If you use `CountRestDataProvider` and your list routes send `Content-Range`, as IGNIS CRUD routes do, remove the binding: the default provider reads the total from the header, with one request per list.'
      - "With `RequestCountData.DATA_WITH_COUNT` on a request that is no list, code that read another key of the body than `data`, `count` or `total` from the answer passes `headers: { 'x-request-count': RequestCountData.DATA_WITH_COUNT }` in place of `requestCountData`, so the server is asked the same, and reads the body from `data`."
      - 'An `IDataProvider` written as an object literal, a test fake included, needs a `send` that is a function with both overload declarations (`schema` required, answering `INetworkResponse<TResult>`; `schema` optional, answering `INetworkResponse`) and one implementation that hands its answer to `NetworkResponseReader.checkData` when a schema is given. An arrow function cannot declare both; no cast is needed.'
    before: |-
      const response = await dataProvider.send<{ message: string }>({ resource: 'hello', params: { method: 'GET' } });
    after: |-
      const response = await dataProvider.send({ resource: 'hello', params: { method: 'GET' }, schema: helloSchema });
  downgrade:
    steps:
      - 'Pin the four ARDOR packages to 0.5.0-12 or earlier, remove each `schema` property and name the type with a type argument again.'
  data: Nothing stored or sent changes. A response that does not fit its schema is now refused where it passed through before.

no-auth-options:
  symbols: [INoAuthOptions, IRestDataProviderOptions, DefaultNetworkRequestService]
  upgrade:
    steps:
      - 'Run `bun run ardor codemod no-auth src` to preview, then add `--write`. It rewrites the object literals it can move whole, and lists with file and line what it left. It reads TypeScript files only: search JavaScript and JSON yourself.'
      - 'At each listed place, write `noAuth: { paths, regex }`; read `options.noAuth?.paths` and `options.noAuth?.regex` where you read the old names.'
      - 'Check every place that merges two options objects, in any file. Where both set `noAuth`, merge them: `noAuth: { ...base.noAuth, ...extra.noAuth }`. A plain spread keeps only the last one, nothing throws, and a request meant to go without a token then carries it.'
      - 'Run `bun check`, then start the app: a provider or service given an old name, or a `noAuth` of another shape, throws and says so.'
      - 'A subclass of `DefaultNetworkRequestService` keeps `this.noAuthPaths`, `this.noAuthPathRegexes`, `isNoAuthPath` and `compileNoAuthPathRegex`.'
    before: |-
      return { url: '/api', noAuthPaths: ['/auth/sign-in'], noAuthPathRegex: /^public/ };
    after: |-
      return { url: '/api', noAuth: { paths: ['/auth/sign-in'], regex: /^public/ } };
  downgrade:
    steps:
      - 'Pin the four ARDOR packages to 0.5.0-12 or earlier and write `noAuthPaths` and `noAuthPathRegex` again.'
  data: Nothing stored changes. Once every old option is moved and merged, the same requests carry a token as before.
  codemod: no-auth

request-payload:
  symbols:
    [ISendParams, IRestRequestOptions, IGetRequestPropsParams, RequestBodyEncoder, IRequestPayload]
  upgrade:
    steps:
      - 'First find your own code that reads the old names, in TypeScript and JavaScript: a data provider or transport (`params.body`, `params.bodyType`) and every override of `send`, `request` or `getRequestProps` (`opts.body`, `params.body`, and the `body` read from the result before or after `super`). ARDOR now calls them with `payload`, the sign-in request included, so these reads give `undefined`, often with no error: the request goes out without its body, or a value computed from the body is wrong.'
      - 'There, read `payload?.data` and `payload?.type`. In a `send` or `request` override that does not call `super`, call `RequestBodyEncoder.assertPayload` first, so that an old caller is refused: `{ options: params, owner: "MyProvider" }` in `send`, `{ options: opts, owner: "MyProvider" }` in `request`, which also passes `payload` on to `getRequestProps`.'
      - 'Replace `body: x` with `payload: { data: x }`, and `body: x, bodyType: t` with `payload: { data: x, type: t }`, wherever you call `send`, `request`, `getRequestProps` or `RequestBodyEncoder.encode`. Leave out `payload` where there was no body.'
      - 'Run `bun check`. It marks an object literal written at the call; an options object kept in a variable or spread into the call, and a type of your own with a `body` field, compile unchanged.'
      - 'A base method given `body` or `bodyType` throws and names `payload` the first time it runs. An override of yours does not, unless it calls the base method with those options.'
      - 'Leave the encoded side as it is: the `body` that `getRequestProps` and `encode` return and the `body` of `doRequest`. An override of `encodeBody({ bodyType, body })` keeps its signature; where it called `RequestBodyEncoder.encode(opts)`, call `super.encodeBody(opts)`.'
      - 'There is no codemod: `body` is also the name of other things (`fetch`, `HttpRepository.execute`).'
    before: |-
      await dataProvider.send({ resource: 'upload', params: { method: 'POST', body: files, bodyType: RequestBodyTypes.FORM_DATA } });
    after: |-
      await dataProvider.send({ resource: 'upload', params: { method: 'POST', payload: { data: files, type: RequestBodyTypes.FORM_DATA } } });
  downgrade:
    steps:
      - 'Pin the four ARDOR packages to 0.5.0-12 or earlier and write `body` and `bodyType` again.'
  data: Nothing stored changes. The same bytes are sent.

scoped-key-prefixes:
  symbols: [IScopedKeys, LocalStorageKeys, DefaultAuthService.keys]
  upgrade:
    steps:
      - 'Run `bun check`: it marks each typed read of `authPrefix`, `storePrefix` or `prefsPrefix`.'
      - 'Replace `keys.authPrefix` with `keys.prefixes.auth`, `keys.storePrefix` with `keys.prefixes.store` and `keys.prefsPrefix` with `keys.prefixes.prefs`, overrides of `clearStoredData` and `isSessionKey` included.'
      - 'Search JavaScript, and TypeScript that casts, for the three old names: they read as `undefined`. `BrowserStorage` throws for that prefix, which the auth provider logs as `[clearStoredData] failed` while the session still ends and the data stays. A comparison of your own such as `key.startsWith(keys.authPrefix)` just matches nothing.'
    before: |-
      BrowserStorage.removeWhere({ storage: StorageAreas.LOCAL, prefix: authService.keys.storePrefix });
    after: |-
      BrowserStorage.removeWhere({ storage: StorageAreas.LOCAL, prefix: authService.keys.prefixes.store });
  downgrade:
    steps:
      - 'Pin the four ARDOR packages to 0.5.0-12 or earlier and read `authPrefix`, `storePrefix` and `prefsPrefix` again.'
  data: Nothing stored changes. The key strings are the same, so sessions and stored data are found as before.

storage-prefix-checked:
  symbols: [BrowserStorage.removeWhere, BrowserStorage.keys]
  upgrade:
    steps:
      - 'Where you call `BrowserStorage.keys` with a prefix that may be empty or `undefined`, leave the option out to list every key: `prefix ? { storage, prefix } : { storage }`.'
      - 'Where you call `BrowserStorage.removeWhere` with a prefix that may be empty, call it only when there is one.'
    before: |-
      const keys = BrowserStorage.keys({ prefix: maybePrefix });
    after: |-
      const keys = BrowserStorage.keys(maybePrefix ? { prefix: maybePrefix } : {});
  downgrade:
    steps:
      - 'Pin the four ARDOR packages to 0.5.0-12 or earlier.'
  data: Nothing stored changes.

request-methods-removed:
  symbols: [RequestMethods, TRequestMethod, DefaultNetworkRequestService]
  upgrade:
    steps:
      - 'Add `@venizia/ignis-helpers` to the dependencies of each package that does not list it.'
      - "Run `bun run ardor codemod http-methods src` to preview, then add `--write`. It rewrites the type `TRequestMethod` and a value where ARDOR itself sends it (the `params` of a data provider `send`, a network service `doRequest`, an `ISendParams`; the receiver must be typed as ARDOR's), and lists with file and line what it left."
      - 'Fix what it listed. Where ARDOR hands you a method (an override of `request` or `doRequest`, a transport), it is uppercase: compare `method.toLowerCase() === HTTP.Methods.X`. In your own `fetch` call write `HTTP.Methods.X.toUpperCase()`. Replace `isValid` and `values()` with `Object.values(HTTP.Methods)`.'
      - 'Search for comparisons with an uppercase text or `HTTP.Methods` in an override of `send`: it receives what the caller wrote, which is lowercase when the caller writes `HTTP.Methods.X`.'
    before: |-
      import { RequestMethods, type ISendParams } from '@venizia/ardor';
      export const params: ISendParams = { method: RequestMethods.PATCH };
      export const isPatch = (method: string) => method === RequestMethods.PATCH;
    after: |-
      import type { ISendParams } from '@venizia/ardor';
      import { HTTP } from '@venizia/ignis-helpers/common';
      export const params: ISendParams = { method: HTTP.Methods.PATCH };
      export const isPatch = (method: string) => method.toLowerCase() === HTTP.Methods.PATCH;
  downgrade:
    steps:
      - Pin the four ARDOR packages to 0.5.0-13 and import RequestMethods and TRequestMethod from ARDOR again.
  data: Nothing stored changes. The same methods are sent.
  codemod: http-methods

data-source-resolvers:
  symbols: [IDataSourceAuth, DefaultNetworkRequestService.getDataSourceAuth]
  upgrade:
    steps:
      - 'Upgrade `@venizia/ignis-connectors` and the four ARDOR packages together.'
      - 'In every `HttpDataSource` settings, move `authTokenResolver` to `resolvers.authToken` and `headersResolver` to `resolvers.headers`. A call of `auth.authTokenResolver` is `auth.resolvers.authToken`.'
